        skills: [image-to-artist, image-to-movement, work-to-date]
      - id: art-1-8
        title: Cézanne
        introduces: [cezanne, sainte-victoire, joueurs-cartes, corbeille-pommes]
        skills: [image-to-artist, image-to-movement, work-to-date]
