# Extraits audio du parcours musique, choisis à la main parmi des enregistrements libres.
#   source   : fichier Wikimedia Commons (« File:… » ou URL de la page), ou URL directe
#   start    : début de l'extrait, en secondes ou « m:ss » (le silence initial est retiré)
#   duration : 15 à 25 s
#   credit / license / sourceUrl : obligatoires pour une source hors Commons, sinon facultatifs
#     (ils remplacent alors les métadonnées Commons). Les crédits ci-dessous reprennent les
#     descriptions des fichiers Commons, dont le champ « auteur » ne nomme souvent que le compositeur.
# Les points de départ n'ont pas été écoutés : voir content/TO_REVIEW.md.
